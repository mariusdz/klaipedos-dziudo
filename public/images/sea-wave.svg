<!--?xml version="1.0" encoding="UTF-8"?-->
<svg viewBox="0 0 1440 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient for deeper sea -->
    <linearGradient id="seaGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e4a7b"></stop>
      <stop offset="60%" stop-color="#12658f"></stop>
      <stop offset="100%" stop-color="#7ec8e3"></stop>
    </linearGradient>

    <!-- Lighter wave gradient -->
    <linearGradient id="waveGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2a8fb6"></stop>
      <stop offset="100%" stop-color="#68c0df"></stop>
    </linearGradient>

    <!-- Soft white for foam -->
    <linearGradient id="foam" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"></stop>
    </linearGradient>

    <!-- Tiny blur filter for subtle soft edges -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"></feGaussianBlur>
    </filter>

    <!-- A path to reuse for repeated small splashes -->
    <path id="splash" d="M0 0 C2 -4 8 -4 10 0 C8 -2 4 -1 0 0z"></path>
  </defs>

  <!-- background sky -->
  <rect width="100%" height="100%" fill="#f7fdff"></rect>

  <!-- distant darker sea block -->
  <g transform="translate(0,180)">
    <path d="M0,140 C160,90 320,120 480,100 C640,80 800,120 960,90 C1120,60 1280,110 1440,90 L1440,340 L0,340 Z" fill="url(#seaGrad)" opacity="0.95"></path>
  </g>

  <!-- mid waves layer -->
  <g transform="translate(0,200)">
    <path d="M0,140 C120,100 220,70 360,100 C500,130 640,80 780,110 C920,140 1040,110 1180,130 C1310,148 1390,120 1440,110 L1440,340 L0,340 Z" fill="url(#waveGrad)" opacity="0.95"></path>
  </g>

  <!-- Foreground big rolling wave with crest -->
  <g transform="translate(0,220)">
    <path d="M0,160 C160,60 320,40 480,80 C640,120 800,40 960,70 C1120,100 1280,40 1440,60 L1440,340 L0,340 Z" fill="#2aa0cf"></path>

    <!-- foam crest (white) -->
    <path d="M-20,160
             C80,80 200,60 320,90
             C440,120 560,80 680,110
             C800,140 920,100 1040,120
             C1160,140 1280,110 1460,90
             L1440,120 L-20,120 Z" fill="url(#foam)" filter="url(#soft)" opacity="0.95"></path>
  </g>

  <!-- foam streaks and splashes (individual accents) -->
  <g transform="translate(0,200)" fill="#fff" opacity="0.95">
    <!-- splashes near wave crests -->
    <use href="#splash" x="300" y="-18" transform="scale(1.6) rotate(-10)"></use>
    <use href="#splash" x="330" y="-10" transform="scale(1.0) rotate(-5)"></use>
    <use href="#splash" x="680" y="-16" transform="scale(1.8) rotate(6)"></use>
    <use href="#splash" x="720" y="-8" transform="scale(1.1) rotate(2)"></use>
    <use href="#splash" x="1020" y="-12" transform="scale(1.5) rotate(-4)"></use>
    <use href="#splash" x="1060" y="-6" transform="scale(0.9) rotate(10)"></use>

    <!-- rounded drops -->
    <circle cx="310" cy="-6" r="3"></circle>
    <circle cx="334" cy="-3" r="2.2"></circle>
    <circle cx="690" cy="-8" r="3.6"></circle>
    <circle cx="725" cy="-4" r="2.4"></circle>
    <circle cx="1012" cy="-6" r="3"></circle>
    <circle cx="1058" cy="-2" r="2"></circle>
  </g>

  <!-- subtle white foam lines (thin) -->
  <g transform="translate(0,230)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M20 10 C120 0 220 -10 320 -2"></path>
    <path d="M420 6 C520 -6 620 -12 720 -4"></path>
    <path d="M820 8 C920 -2 1020 -10 1120 -3"></path>
  </g>

  <!-- optional decorative tatami-style circle at bottom center (very subtle) -->
  <g transform="translate(720,380)" opacity="0.12">
    <circle r="120" fill="#ffffff"></circle>
    <circle r="90" fill="#e6f7ff"></circle>
  </g>

  <!-- small highlight glints on water -->
  <g transform="translate(0,240)" fill="#ffffff" opacity="0.9">
    <ellipse cx="200" cy="-8" rx="10" ry="2"></ellipse>
    <ellipse cx="520" cy="-6" rx="8" ry="1.8"></ellipse>
    <ellipse cx="940" cy="-7" rx="9" ry="2"></ellipse>
  </g>

  <!-- If you want animation, uncomment the below simple horizontal shift for mid waves -->
  <!--
  <g transform="translate(0,200)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -20 0; 0 0" dur="6s" repeatCount="indefinite" />
  </g>
  -->

</svg>
